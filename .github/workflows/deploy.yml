name: Deploy FindMyInterior

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend (Check)
        working-directory: ./findmyinterior-frontend
        run: |
          npm ci
          npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/find-my-interior
            git pull origin main

            # Backend
            cd /var/www/find-my-interior/findmyinterior-backend
            composer install --no-dev --optimize-autoloader
            
            # Use safe migrate if script exists, else fallback to standard
            if [ -f "../scripts/safe-migrate.sh" ]; then
                bash ../scripts/safe-migrate.sh
            else
                php artisan migrate --force
            fi
            
            php artisan config:cache
            php artisan route:cache
            php artisan storage:link || true
            
            # Restart backend container to pick up changes
            cd /var/www/find-my-interior
            docker compose restart backend queue-worker || true

            # Frontend
            cd /var/www/find-my-interior/findmyinterior-frontend
            npm install
            npm run build
            
            # Restart frontend
            cd /var/www/find-my-interior
            docker compose restart frontend || true
            
            # Post deploy script for deployment status
            if [ -f "./docker/post-deploy.sh" ]; then
                bash ./docker/post-deploy.sh
            fi

      - name: Verify Health
        run: |
          sleep 10
          curl -s --fail https://findmyinterior.com/api/v1/health || exit 1
          curl -s --fail https://findmyinterior.com/ || exit 1
