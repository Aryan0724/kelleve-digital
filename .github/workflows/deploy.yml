name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 600s
          script: |
            set -e
            echo "=== Navigating to project directory ==="
            cd /var/www/find-my-interior

            echo "=== Force pulling latest code from GitHub ==="
            git fetch --all
            git reset --hard origin/main
            git clean -fd

            echo "=== Rebuilding Docker containers (--no-cache) ==="
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            echo "=== Clearing Laravel caches inside container ==="
            sleep 5
            docker exec fmi_backend php artisan route:clear || true
            docker exec fmi_backend php artisan config:clear || true
            docker exec fmi_backend php artisan cache:clear || true

            echo "=== Waiting for containers to start ==="
            sleep 5

            echo "=== Container Status ==="
            docker compose ps

            echo "=== Deploy complete! ==="
