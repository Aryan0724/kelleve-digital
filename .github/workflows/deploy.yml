name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 600s
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            echo "=== Ensuring /docker/find-my-interior links to /var/www/find-my-interior ==="
            if [ -d "/docker/find-my-interior" ] && [ ! -L "/docker/find-my-interior" ]; then
              rsync -a /docker/find-my-interior/ /var/www/find-my-interior/ 2>/dev/null || cp -rn /docker/find-my-interior/* /var/www/find-my-interior/ 2>/dev/null || true
              rm -rf /docker/find-my-interior
              ln -s /var/www/find-my-interior /docker/find-my-interior
            elif [ ! -e "/docker/find-my-interior" ]; then
              mkdir -p /docker
              ln -s /var/www/find-my-interior /docker/find-my-interior
            fi

            echo "=== Navigating to project directory ==="
            cd /var/www/find-my-interior

            echo "=== Pulling latest code ==="
            git fetch origin
            git reset --hard origin/main

            echo "=== Clearing host Laravel cache files ==="
            rm -f findmyinterior-backend/bootstrap/cache/*.php || true

            echo "=== Rebuilding frontend with no cache ==="
            docker-compose build --no-cache frontend || docker compose build --no-cache frontend

            echo "=== Starting all containers ==="
            docker-compose up -d || docker compose up -d

            echo "=== Clearing Laravel caches ==="
            sleep 15
            docker exec fmi_backend php artisan route:clear || true
            docker exec fmi_backend php artisan config:clear || true
            docker exec fmi_backend php artisan cache:clear || true

            echo "=== Container Status ==="
            docker compose ps

            echo "=== Deploy complete! ==="

      - name: Purge Cloudflare Cache
        if: ${{ secrets.CF_ZONE_ID != '' && secrets.CF_API_TOKEN != '' }}
        run: |
          echo "Purging Cloudflare cache for zone ${{ secrets.CF_ZONE_ID }}..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | python3 -c "import sys,json; r=json.load(sys.stdin); print('✅ Cache purged' if r.get('success') else '❌ Purge failed: ' + str(r))"
