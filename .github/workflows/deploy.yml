name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 600s
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            echo "=== Ensuring /docker/find-my-interior links to /var/www/find-my-interior ==="
            if [ -d "/docker/find-my-interior" ] && [ ! -L "/docker/find-my-interior" ]; then
              rsync -a /docker/find-my-interior/ /var/www/find-my-interior/ 2>/dev/null || cp -rn /docker/find-my-interior/* /var/www/find-my-interior/ 2>/dev/null || true
              rm -rf /docker/find-my-interior
              ln -s /var/www/find-my-interior /docker/find-my-interior
            elif [ ! -e "/docker/find-my-interior" ]; then
              mkdir -p /docker
              ln -s /var/www/find-my-interior /docker/find-my-interior
            fi

            echo "=== Navigating to project directory ==="
            cd /var/www/find-my-interior

            echo "=== Pulling latest code ==="
            git fetch origin
            git reset --hard origin/main

            echo "=== Free disk space ==="
            df -h /
            docker system df

            echo "=== Stop old containers ==="
            docker-compose down || docker compose down || true

            echo "=== Prune dangling images to free space ==="
            docker image prune -f || true

            echo "=== Rebuilding frontend with no cache ==="
            docker-compose build --no-cache --progress=plain frontend 2>&1 | tail -50 || docker compose build --no-cache --progress=plain frontend 2>&1 | tail -50

            echo "=== Build exit code: $? ==="

            echo "=== Starting all containers ==="
            docker-compose up -d || docker compose up -d

            echo "=== Clearing Laravel caches ==="
            sleep 15
            docker exec fmi_backend php artisan route:clear || true
            docker exec fmi_backend php artisan config:clear || true
            docker exec fmi_backend php artisan cache:clear || true

            echo "=== Container Status ==="
            docker compose ps

            echo "=== Deploy complete! ==="

