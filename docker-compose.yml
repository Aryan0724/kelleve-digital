services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: fmi_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=64M --max-connections=100 --key-buffer-size=16M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-findmyinterior}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-fmi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - fmi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  # Laravel Backend (API)
  backend:
    build:
      context: ./findmyinterior-backend
      dockerfile: Dockerfile
    container_name: fmi_backend
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-findmyinterior}
      DB_USERNAME: ${DB_USERNAME:-fmi_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    volumes:
      - storage_data:/var/www/html/storage/app/public
      - backups_data:/var/www/backups
    networks:
      - fmi-network
    deploy:
      resources:
        limits:
          memory: 512M

  # TrueDial Dedicated Laravel Backend (API)
  truedial_backend:
    build:
      context: ./truedial-backend
      dockerfile: Dockerfile
    container_name: truedial_backend
    restart: unless-stopped
    ports:
      - "8001:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_DATABASE: ${TRUEDIAL_DB_DATABASE:-truedial_db}
      DB_USERNAME: ${DB_USERNAME:-fmi_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    volumes:
      - truedial_storage_data:/var/www/html/storage/app/public
    networks:
      - fmi-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Next.js Frontend
  frontend:
    build:
      context: ./findmyinterior-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://findmyinterior.com/api/v1
        CACHE_BUST: ${CACHE_BUST:-1}
    container_name: fmi_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://findmyinterior.com/api/v1
      NEXT_PRIVATE_API_URL: http://backend:80/api/v1
      NODE_OPTIONS: "--max-old-space-size=512"
    networks:
      - fmi-network
    deploy:
      resources:
        limits:
          memory: 256M

  # Redis for Queue & Cache
  redis:
    image: redis:alpine
    container_name: fmi_redis
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - fmi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  dbdata:
  storage_data:
  backups_data:
  truedial_storage_data:

networks:
  fmi-network:
    driver: bridge
